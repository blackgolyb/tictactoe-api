version: "3.0"
services:
  app:
    container_name: tic-tac-toe-api
    image: blackgolyb/tic-tac-toe-api:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.x86
    env_file:
      - env/.env.deploy
    expose:
      - "8080"
    networks:
      - tailnet
    volumes:
      - ./store:/app/store

  tailscale:
    container_name: tic-tac-toe-ts-proxy
    image: tailscale/tailscale:latest
    hostname: tic-tac-toe
    restart: always
    profiles:
      - tailscale
    depends_on:
      - app
    networks:
      - tailnet
    env_file:
      - env/.env.deploy
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/etc/tailscale/serve.json
      - TS_EXTRA_ARGS=--reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/etc/tailscale/serve.json:ro
      - ./scripts/tailscale-entrypoint.sh:/tailscale-entrypoint.sh:ro
    command: ["sh", "/tailscale-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

networks:
  tailnet:
    driver: bridge

volumes:
  tailscale-state:
