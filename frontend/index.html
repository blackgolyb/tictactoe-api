<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="content">
            <game-selector></game-selector>

            <tab-container id="game-switcher">
                <tab-button slot="tabs" for="preview" selected
                    >Preview</tab-button
                >
                <tab-button slot="tabs" for="code-md">Markdown</tab-button>
                <tab-button slot="tabs" for="code-html">HTML</tab-button>

                <tab-panel slot="panels" tab-id="preview">
                    <playable-game-view></playable-game-view>
                </tab-panel>

                <tab-panel slot="panels" tab-id="code-md">
                    <markdown-game-view></markdown-game-view>
                </tab-panel>

                <tab-panel slot="panels" tab-id="code-html">
                    <html-game-view></html-game-view>
                </tab-panel>
            </tab-container>
        </div>

        <!-- Create Game Modal -->
        <modal-window id="create-game-modal">
            <h2 slot="title">Create New Game</h2>
            <create-game-form></create-game-form>
        </modal-window>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
