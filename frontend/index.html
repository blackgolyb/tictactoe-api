<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div class="content">
            <tab-container id="game-switcher">
                <tab-button slot="tabs" for="preview" selected
                    >Preview</tab-button
                >
                <tab-button slot="tabs" for="code-md">Markdown</tab-button>
                <tab-button slot="tabs" for="code-html">HTML</tab-button>

                <tab-panel slot="panels" tab-id="preview">
                    <table id="game-preview">
                        <thead>
                            <tr>
                                <th>Tic</th>
                                <th>Tac</th>
                                <th>Toe</th>
                            </tr>
                        </thead>
                        <tbody id="fields"></tbody>
                        <template id="fieldTemplate">
                            <img class="field" />
                        </template>
                    </table>
                </tab-panel>

                <tab-panel slot="panels" tab-id="code-md">
                    <code id="markdown-game-code">Some md</code>
                </tab-panel>

                <tab-panel slot="panels" tab-id="code-html">
                    <code id="html-game-code">Some html</code>
                </tab-panel>
            </tab-container>
        </div>
        <script type="module" src="/main.ts"></script>
    </body>
</html>
